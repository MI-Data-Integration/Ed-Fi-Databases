version: 0.2

env:
  variables:
    CODEARTIFACT_DOMAIN: "artifact_domain"
    CODEARTIFACT_DOMAIN_OWNER: "artifact_domain_account"
    CODEARTIFACT_REPOSITORY: "artifact_repository"
    AWS_DEFAULT_REGION: "region"
    PACKAGE_VERSION: ""

phases:
  install:
    runtime-versions:
      dotnet: "8.0"
    commands:
      - echo "Install CodeArtifact credential provider for NuGet"
      - dotnet tool install -g AWS.CodeArtifact.NuGet.CredentialProvider
      - export PATH="$PATH:/root/.dotnet/tools"
      - echo "Dotnet runtime info..."
      - dotnet --info
      - echo "Restoring dependencies..."
      - dotnet restore src/EdFi.Db.Deploy.sln

  pre_build:
    commands:
      - echo "Determining package version..."
      - export PACKAGE_VERSION=${PACKAGE_VERSION:-$(git describe --tags --exact-match 2>/dev/null || echo "0.0.${CODEBUILD_BUILD_NUMBER}")}
      - echo "Using package version $PACKAGE_VERSION"

  build:
    commands:
      - echo "Building solution with version=$PACKAGE_VERSION..."
      - dotnet build src/EdFi.Db.Deploy.sln -c Release --no-restore -p:InformationalVersion="$PACKAGE_VERSION" -p:FileVersion="$PACKAGE_VERSION"

  post_build:
    commands:
      - echo "Logging into CodeArtifact for dotnet..."
      - aws codeartifact login --tool dotnet --repository $CODEARTIFACT_REPOSITORY --domain $CODEARTIFACT_DOMAIN --domain-owner $CODEARTIFACT_DOMAIN_OWNER --region $AWS_DEFAULT_REGION
      - echo "Packing project with PackageVersion=$PACKAGE_VERSION and PackageId=EdFi.Suite3.Db.Deploy..."
      - mkdir -p artifacts
      - dotnet pack src/EdFi.Db.Deploy/EdFi.Db.Deploy.csproj -c Release -o artifacts -p:PackageVersion="$PACKAGE_VERSION" -p:PackageId="EdFi.Suite3.Db.Deploy"
      - echo "Fetching CodeArtifact auth token for push..."
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $CODEARTIFACT_DOMAIN --domain-owner $CODEARTIFACT_DOMAIN_OWNER --region $AWS_DEFAULT_REGION --query authorizationToken --output text)
      - echo "Pushing packages to CodeArtifact..."
      - for pkg in artifacts/*.nupkg; do dotnet nuget push "$pkg" --source "$CODEARTIFACT_DOMAIN/$CODEARTIFACT_REPOSITORY" --api-key $CODEARTIFACT_AUTH_TOKEN --skip-duplicate; done

artifacts:
  files:
    - artifacts/*.nupkg

cache:
  paths:
    - ~/.nuget/packages/**/*
